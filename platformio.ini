; PlatformIO Project Configuration File
; UART Communication Test: Arduino Nano <---> ESP32-S3

[platformio]
default_envs = nano, esp32s3

; -------------------------------------------------------------
; Environment: Arduino Nano (ATmega328P)
; -------------------------------------------------------------
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<nano_main.cpp>

; If using an older Nano bootloader and upload fails, uncomment the following line:
; board = nanoatmega328new

; -------------------------------------------------------------
; Environment: ESP32-S3 (DevKitC-1 / SuperMini)
; -------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Configurar Flash de 4MB para ESP32-S3 SuperMini
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D OTA_ENABLED=1
build_src_filter = +<esp32s3_main.cpp> +<snr8503_protocol.cpp> +<cloud_worker.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

