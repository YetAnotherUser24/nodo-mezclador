; PlatformIO - Nodo MEZCLADOR (Blue Robotics T200 con driver SNR8503M)
;
; Placa real: ESP32-S3 (SuperMini / DevKitC-1, 4 MB). No es un ESC: el driver lleva el lazo PI
; dentro (Kp=0.00274565, Ki=0.00642846, Kd=0) y la salida es un duty PWM de 10 kHz.
;
;   pio run                          -> construye el entorno por defecto (esp32-s3)
;   pio run -t upload                -> flashea por USB
;   pio run -e esp32-s3-ota -t upload  -> flashea por WiFi (mixer-t200.local)
;
; `default.csv` ya incluye dos ranuras de aplicacion, que es lo que el OTA necesita.

[platformio]
default_envs = esp32-s3

; ---------------------------------------------------------------
; PLACA REAL: ESP32-S3, 4 MB
; ---------------------------------------------------------------
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOTA_ENABLED=1
; Solo el nodo: el banco del Nano y la copia de PCNT no forman parte del firmware.
build_src_filter =
    +<esp32s3_main.cpp>
    +<snr8503_protocol.cpp>
    +<cloud_worker.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = mixer-t200.local
upload_flags =
    --port=3232
    --timeout=60

; ---------------------------------------------------------------
; BANCO: enlace UART con un Arduino Nano (ATmega328P). NO es el nodo.
; Si la placa tiene bootloader antiguo y falla la subida, usa nanoatmega328new.
; ---------------------------------------------------------------
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<nano_main.cpp>